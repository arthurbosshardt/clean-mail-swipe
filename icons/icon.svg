<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle de fond -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
  
  <!-- Icône d'enveloppe -->
  <path d="M 30 40 L 64 65 L 98 40 L 98 88 L 30 88 Z" fill="white" opacity="0.9"/>
  <path d="M 30 40 L 64 65 L 98 40" stroke="#667eea" stroke-width="2" fill="none"/>
  
  <!-- Icône de nettoyage (balai) -->
  <line x1="75" y1="50" x2="85" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="50" x2="75" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>

